name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: stage
        type: choice
        options: [dev, stage, prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build & push Docker images ──────────────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ env.REGISTRY }}/pulse-backend:${{ github.sha }}
      frontend_image: ${{ env.REGISTRY }}/pulse-frontend:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend_fresh
          push: true
          tags: |
            ${{ env.REGISTRY }}/pulse-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/pulse-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/pulse-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/pulse-frontend:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to staging ──────────────────────────────────────────────────────
  deploy-stage:
    name: Deploy → Stage
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: stage
      url: https://pulse-stage.tinkoff.ru
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_STAGE }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to stage
        run: |
          kubectl set image deployment/pulse-backend \
            backend=${{ needs.build.outputs.backend_image }} \
            -n pulse-stage
          kubectl set image deployment/pulse-frontend \
            frontend=${{ needs.build.outputs.frontend_image }} \
            -n pulse-stage
          kubectl rollout status deployment/pulse-backend -n pulse-stage --timeout=3m
          kubectl rollout status deployment/pulse-frontend -n pulse-stage --timeout=2m

      - name: Smoke test
        run: |
          sleep 15
          curl -f https://pulse-stage.tinkoff.ru/health
          curl -f https://pulse-stage.tinkoff.ru/api/health

  # ── Deploy to production (manual approval) ────────────────────────────────
  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, deploy-stage]
    environment:
      name: prod
      url: https://pulse.tinkoff.ru
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Blue-Green deploy (backend)
        run: |
          kubectl set image deployment/pulse-backend \
            backend=${{ needs.build.outputs.backend_image }} \
            -n pulse-prod
          kubectl rollout status deployment/pulse-backend -n pulse-prod --timeout=5m

      - name: Blue-Green deploy (frontend)
        run: |
          kubectl set image deployment/pulse-frontend \
            frontend=${{ needs.build.outputs.frontend_image }} \
            -n pulse-prod
          kubectl rollout status deployment/pulse-frontend -n pulse-prod --timeout=3m

      - name: Production smoke test
        run: |
          sleep 20
          curl -f https://pulse.tinkoff.ru/health
          curl -f https://pulse.tinkoff.ru/api/health

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Pulse deployed to production",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Pulse* deployed to production\n Commit: `${{ github.sha }}`\nBy: @${{ github.actor }}"
                }
              }]
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Pulse production deploy FAILED",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Pulse* production deploy *FAILED*\nCommit: `${{ github.sha }}`\nBy: @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }]
            }
