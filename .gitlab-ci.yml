stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHA

# ──────────────────────────────────────────────
# LINT
# ──────────────────────────────────────────────

lint:frontend:
  stage: lint
  image: node:20-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
  rules:
    - changes:
        - frontend/**

lint:backend:
  stage: lint
  image: python:3.11-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache
  script:
    - pip install ruff
    - ruff check backend_fresh/
  rules:
    - changes:
        - backend_fresh/**
  allow_failure: true

# ──────────────────────────────────────────────
# TEST
# ──────────────────────────────────────────────

test:ml:
  stage: test
  image: python:3.11-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache
  script:
    - pip install -r requirements.txt pytest
    - pytest ml/ -v --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 7 days
  rules:
    - changes:
        - ml/**
        - requirements.txt

# ──────────────────────────────────────────────
# BUILD
# ──────────────────────────────────────────────

build:frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  variables:
    VITE_API_URL: $VITE_API_URL
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID

build:backend:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --cache-from $DOCKER_IMAGE:latest \
        --tag $DOCKER_IMAGE:$DOCKER_TAG \
        --tag $DOCKER_IMAGE:latest \
        .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backend_fresh/**
        - ml/**
        - requirements.txt
        - Dockerfile

# ──────────────────────────────────────────────
# DEPLOY (только main)
# ──────────────────────────────────────────────

deploy:frontend:
  stage: deploy
  image: alpine:latest
  needs:
    - build:frontend
  environment:
    name: production
    url: $APP_URL
  script:
    # Замени на команду деплоя Spirit или загрузку статики на CDN
    - echo "Deploy frontend/dist/ → Spirit / CDN"
    # Пример для Spirit CLI:
    # spirit deploy --app pulse-frontend --path frontend/dist/
  artifacts:
    paths:
      - frontend/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:backend:
  stage: deploy
  image: alpine:latest
  needs:
    - build:backend
  environment:
    name: production
    url: $APP_URL
  script:
    # Замени на команду деплоя Spirit
    - echo "Deploy $DOCKER_IMAGE:$DOCKER_TAG → Spirit"
    # Пример для Spirit CLI:
    # spirit deploy --app pulse-backend --image $DOCKER_IMAGE:$DOCKER_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backend_fresh/**
        - ml/**
        - requirements.txt
        - Dockerfile
