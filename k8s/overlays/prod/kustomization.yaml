apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulse-prod

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: pulse-backend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: pulse-frontend

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pulse.tinkoff.ru
    target:
      kind: Ingress

images:
  - name: ghcr.io/pulse/backend
    newTag: latest
  - name: ghcr.io/pulse/frontend
    newTag: latest
