apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulse-dev

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pulse-dev.tinkoff.ru
    target:
      kind: Ingress
