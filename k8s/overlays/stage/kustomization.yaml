apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulse-stage

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pulse-backend

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pulse-stage.tinkoff.ru
    target:
      kind: Ingress
